- id: timbre.sintese-basica
  track: timbre
  level: 1
  title: Fundamentos de síntese
  description: Explica o papel do oscilador, do filtro, do envelope ADSR e do LFO, e os ajusta para obter um pad, um pluck e um lead.
  concepts: []
  mastery:
    - id: teoria
      method: quiz
      exercise: timbre.sintese.quiz
    - id: laboratorio
      method: self-assessment
      exercise: timbre.sintese.recriar

- id: timbre.familias
  track: timbre
  level: 2
  title: Famílias de timbres
  description: Reconhece e constrói pads, leads, plucks, strings, órgãos e baixos de synth, e escolhe a família certa para cada função no arranjo.
  prerequisites: [timbre.sintese-basica]
  mastery:
    - id: ouvido
      method: quiz
      exercise: timbre.familias.reconhecer
    - id: laboratorio
      method: self-assessment
      exercise: timbre.familias.construir

- id: timbre.efeitos
  track: timbre
  level: 2
  title: Efeitos e ambiência
  description: Sabe o que fazem reverb, delay, chorus, phaser e drive, e ajusta tempo, repetições e mix para cada timbre e estilo.
  prerequisites: [timbre.sintese-basica]
  mastery:
    - id: teoria
      method: quiz
      exercise: timbre.efeitos.reconhecer
    - id: laboratorio
      method: self-assessment
      exercise: timbre.efeitos.ajustar

- id: timbre.layer-split
  track: timbre
  level: 2
  title: Camadas e divisão do teclado
  description: Monta layers e splits equilibrados (volume, região, efeitos) e toca com eles ao vivo — baixo e piano, pad e piano, piano e strings.
  prerequisites: [timbre.familias, timbre.efeitos]
  mastery:
    - id: teoria
      method: quiz
      exercise: timbre.layer-split.reconhecer
    - id: teclado
      method: self-assessment
      exercise: timbre.layer-split.tocar
      distinctDays: 2

- id: timbre.por-estilo
  track: timbre
  level: 3
  title: Timbres por estilo
  description: Reconhece e reconstrói os timbres característicos de cada estilo — Rhodes, Wurlitzer, órgão com drawbars, clavinet, pads, leads e cordas — e reproduz o som de uma referência.
  prerequisites: [timbre.familias, timbre.efeitos]
  mastery:
    - id: ouvido
      method: quiz
      exercise: timbre.por-estilo.reconhecer
    - id: laboratorio
      method: self-assessment
      exercise: timbre.por-estilo.referencia

- id: timbre.ambiencias
  track: timbre
  level: 3
  title: Ambiências e texturas
  description: Cria ambiências com pads, swells, drones de tônica e quinta, delays e reverbs longos para worship e rock alternativo, inclusive nas transições.
  prerequisites: [timbre.layer-split, timbre.efeitos]
  styles: [worship, rock-alternativo]
  mastery:
    - id: teoria
      method: quiz
      exercise: timbre.ambiencias.reconhecer
    - id: teclado
      method: self-assessment
      exercise: timbre.ambiencias.drone
      distinctDays: 2
