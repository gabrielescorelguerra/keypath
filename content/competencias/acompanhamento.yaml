- id: acompanhamento.inversoes-e-conducao
  track: acompanhamento
  level: 2
  title: Inversões e condução de vozes
  description: Toca tríades nas três posições e encadeia acordes mantendo notas comuns e movendo as outras pelo menor caminho.
  prerequisites: [harmonia.triades]
  concepts: [inversao, conducao-de-vozes]
  mastery:
    - id: teoria
      method: quiz
      exercise: acompanhamento.inversoes.quiz
    - id: teclado
      method: self-assessment
      exercise: acompanhamento.inversoes.campo-conduzido
      distinctDays: 2

- id: acompanhamento.emprestimo-gospel
  track: acompanhamento
  level: 3
  title: Empréstimo modal no acompanhamento gospel
  description: Aplica IVm, ♭VI e ♭VII7 em progressões típicas do louvor, com boa condução de vozes, em pelo menos três tons.
  core: false
  styles: [gospel]
  prerequisites:
    [harmonia.subdominante-menor, harmonia.bvi-bvii, acompanhamento.inversoes-e-conducao]
  concepts: [emprestimo-modal, subdominante-menor, conducao-de-vozes]
  mastery:
    - id: teclado
      method: self-assessment
      exercise: acompanhamento.emprestimo-gospel.progressoes
      distinctDays: 2
    - id: repertorio
      method: self-assessment
      exercise: acompanhamento.emprestimo-gospel.no-repertorio

- id: acompanhamento.gospel-contemporaneo
  track: acompanhamento
  level: 3
  title: Linguagem do gospel contemporâneo
  description: Usa extensões, acordes de passagem (dominantes secundários, diminutos, substituição de trítono), resoluções sus e walk-ups para acompanhar no estilo gospel.
  core: false
  prerequisites:
    [harmonia.funcoes-harmonicas, harmonia.tetrades, acompanhamento.inversoes-e-conducao]
  styles: [gospel]
  mastery:
    - id: ouvido
      method: quiz
      exercise: acompanhamento.gospel.reconhecer
    - id: teclado
      method: self-assessment
      exercise: acompanhamento.gospel.passagens-em-tons
      distinctDays: 2

- id: acompanhamento.worship
  track: acompanhamento
  level: 2
  title: Teclado no worship
  description: Acompanha músicas de worship com voicings abertos, pulsação em colcheias, dinâmica em ondas, pads e transições entre músicas.
  core: false
  prerequisites: [harmonia.campo-harmonico-maior-triades, acompanhamento.inversoes-e-conducao]
  styles: [worship]
  mastery:
    - id: teoria
      method: quiz
      exercise: acompanhamento.worship.reconhecer
    - id: teclado
      method: self-assessment
      exercise: acompanhamento.worship.pulsacao
      distinctDays: 2

- id: acompanhamento.blues
  track: acompanhamento
  level: 2
  title: Blues no teclado
  description: Toca a forma de 12 compassos com shuffle na mão esquerda e acordes dominantes na direita, em vários tons, e improvisa com a escala blues por cima.
  core: false
  prerequisites: [harmonia.tetrades, teoria.pentatonica-e-blues]
  styles: [blues]
  mastery:
    - id: forma
      method: quiz
      exercise: acompanhamento.blues.forma
    - id: teclado
      method: self-assessment
      exercise: acompanhamento.blues.shuffle
      distinctDays: 2

- id: acompanhamento.jazz
  track: acompanhamento
  level: 4
  title: Jazz no teclado
  description: 'Toca II–V–I com shells e voicings sem fundamental, faz comping com suingue e reconhece a forma e o vocabulário do jazz.'
  core: false
  prerequisites: [harmonia.extensoes, teoria.escolha-de-escalas]
  styles: [jazz]
  mastery:
