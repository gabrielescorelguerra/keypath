      exercise: acompanhamento.jazz.levada
      distinctDays: 2

- id: acompanhamento.neo-soul
  track: acompanhamento
  level: 3
  title: Neo-soul e R&B no teclado
  description: 'Usa acordes m9, 7M(9) e 7(4)(9), voicings em quartas e clusters, cromatismos e o groove "atrasado" do neo-soul.'
