id: tecnica.arpejos.padrao-classico
title: Acordes quebrados no estilo do Prelúdio em Dó de Bach
type: performance
stage: application
competencies: [tecnica.arpejos-triades]
prompt: |
  Sobre **C – Dm/C – G7/B – C**, toque cada compasso como acorde quebrado: duas notas graves na
  esquerda e três agudas na direita, subindo — a figura do Prelúdio em Dó maior do Cravo Bem
  Temperado (domínio público). Escolha voicings que mudem pouco de um compasso para o outro.

  ::chords{symbols="C Dm/C G7/B C"}
parameters:
  keys: [C, G]
  startBpm: 60
  targetBpm: 80
  bpmStep: 5
  hands: both
minutes: 20
routine:
  - '**Toque os quatro acordes em bloco** com o voicing da aula: o baixo e a segunda nota na esquerda, três
    notas na direita.'
  - '**Monte a figura** de um compasso: as 5 notas subindo, depois as 3 notas da direita repetidas.'
  - '**Encadeie os compassos** devagar, sem parar entre eles.'
  - '**Escute as vozes:** cada nota da direita deve mudar o mínimo de um compasso para o outro.'
  - '**Suba 5 bpm** por série limpa; transponha para Sol.'
mistakes:
  - 'Pedal sujo: troque o pedal no começo de cada compasso, junto com o baixo.'
checklist:
  - id: figura
    text: Mantive a mesma figura em todos os compassos.
  - id: conducao
    text: Os voicings mudaram pouco de um acorde para o outro.
challenges:
  - Aplique a mesma figura à progressão de uma música do seu repertório.
