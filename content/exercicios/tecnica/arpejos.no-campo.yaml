id: tecnica.arpejos.no-campo
title: Acompanhar uma progressão com arpejos
type: performance
stage: application
competencies: [tecnica.arpejos-tetrades]
prompt: |
  Ligue o playback e acompanhe **I7M – VIm7 – IIm7 – V7** em Sol maior, um acorde por compasso.

  1. Mão esquerda: a fundamental, em semibreve.
  2. Mão direita: o arpejo da tétrade subindo em colcheias (8 notas por compasso: 1-3-5-7-8-7-5-3).
  3. Na troca de acorde, vá para a nota **mais próxima** do acorde seguinte, em vez de voltar
     sempre à fundamental — é condução de vozes aplicada ao arpejo.

  ::progression{key="G" degrees="I7M VIm7 IIm7 V7"}
parameters:
  keys: [G, D, C]
  startBpm: 60
  targetBpm: 84
  bpmStep: 4
  hands: both
  backing: { key: G, degrees: I7M VIm7 IIm7 V7, beatsPerChord: 4 }
minutes: 25
routine:
  - '**Toque as tétrades em bloco** (G7M, Em7, Am7, D7) para conhecer as notas.'
  - '**Arpejo de cada acorde parado**, 1-3-5-7-8-7-5-3, a 60 bpm.'
  - '**Com playback**, ainda voltando à fundamental a cada acorde, 2 voltas.'
  - '**Condução:** na troca, comece o novo arpejo pela nota mais próxima da última que você tocou (por exemplo,
    do Fá♯ do G7M para o Sol do Em7).'
  - '**Transponha** para Ré e Dó; suba 4 bpm por série limpa.'
mistakes:
  - Atrasar a troca de acorde porque o arpejo "não terminou" — o acorde novo manda, mesmo que o desenho
    fique incompleto.
checklist:
  - id: tempo
    text: Toquei junto com o playback por quatro voltas sem perder o primeiro tempo do compasso.
  - id: trocas
    text: Troquei de acorde exatamente no tempo 1, sem atrasar a mão direita.
  - id: conducao
    text: Pelo menos em uma volta, comecei cada arpejo pela nota mais próxima do acorde anterior.
challenges:
  - Troque o padrão para 1-5-8-10 na mão esquerda (fundamental, quinta, oitava e décima) e só a tríade na direita — o desenho clássico de balada.
  - Faça o mesmo em Ré e em Dó com o playback.
