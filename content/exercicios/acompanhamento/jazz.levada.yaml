id: acompanhamento.jazz.levada
title: Comping com voicings sem fundamental sobre o playback
type: performance
stage: application
competencies: [acompanhamento.jazz]
prompt: |
  O playback toca **Gm7 – C7 – F7M – D7** em Fá (II–V–I–VI, o turnaround mais comum).

  1. **Shells** na mão esquerda (fundamental + 7ª ou fundamental + 3ª), um por compasso.
  2. **Voicings sem fundamental** na mão esquerda, alternando tipo A e B para conduzir:
     Gm7(9) tipo A (Si♭ Ré Fá Lá) → C7(13) tipo B (Si♭ Ré Mi Lá) → F7M(9) tipo A (Lá Dó Mi Sol).
  3. **Ritmo:** toque o acorde no tempo 1 e no "e" do 2 (Charleston), com colcheias suingadas.

  ::chords{symbols="Gm9 C13 Fmaj9 D7b9" key="F"}
parameters:
  keys: [F, Bb, C]
  startBpm: 80
  targetBpm: 140
  bpmStep: 10
  hands: left
  backing: { key: F, degrees: IIm7 V7 I7M VI7, beatsPerChord: 4 }
checklist:
  - id: shells
    text: Toquei duas voltas só com shells.
  - id: rootless
    text: Toquei duas voltas com voicings sem fundamental, alternando A e B.
  - id: ritmo
    text: Mantive o Charleston suingado sem atrasar as trocas.
challenges:
  - Com a mão direita, improvise com notas-guia enquanto a esquerda faz o comping.
  - Faça o mesmo em Si♭ e em Mi♭.
