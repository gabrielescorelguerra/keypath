id: acompanhamento.emprestimo-gospel.progressoes
title: Progressões gospel com empréstimo modal
type: performance
competencies: [acompanhamento.emprestimo-gospel]
styles: [gospel]
prompt: |
  Toque as quatro progressões com baixo na mão esquerda e condução de vozes na direita.
  Em Sol:

  ::progression{key="G" degrees="I I7 IV IVm I"}

  ::progression{key="G" degrees="I IV IVm6 I"}

  ::progression{key="G" degrees="IV V bVI bVII I"}

  ::progression{key="G" degrees="VIm7 IV IVm I"}
parameters:
  keys: [G, C, D, A, E, Bb]
  targetBpm: 70
  hands: both
minutes: 25
routine:
  - '**Em Sol, uma progressão por vez**, 4 voltas cada, um acorde por compasso.'
  - '**Ouça a condução:** no IV → IVm, só a terça desce (Mi → Mi♭); no I → I7, entra o Fá.'
  - '**Progressão 3:** E♭ – F – G no final, com a nota de cima subindo.'
  - '**Os outros tons**, um por dia, dizendo os acordes antes de tocar.'
mistakes:
  - Tocar o ♭VI e o ♭VII menores — são maiores.
checklist:
  - id: tres-tons
    text: Toquei as quatro progressões em pelo menos três tons.
  - id: conducao
    text: Usei inversões próximas — a mão direita quase não saltou.
  - id: baixo
    text: A mão esquerda manteve o baixo firme, sem perder o andamento.
