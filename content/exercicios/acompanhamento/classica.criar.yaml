id: acompanhamento.classica.criar
title: Uma frase clássica de 8 compassos
type: performance
stage: creativity
competencies: [acompanhamento.classica]
prompt: |
  Componha uma frase de 8 compassos no estilo clássico: 4 compassos terminando numa cadência
  suspensiva (no V) e 4 respondendo com uma cadência autêntica (no I). Use baixo de Alberti na
  esquerda.
parameters:
  keys: [C, G]
minutes: 40
routine:
  - '**Escolha o tom** e escreva o plano harmônico: compassos 1–4 terminando no V; 5–8 terminando em V7
    – I.'
  - '**Toque o plano** com baixo de Alberti, sem melodia.'
  - '**Melodia da pergunta** (1–4), terminando numa nota do V (Ré ou Si, em Dó).'
  - '**Melodia da resposta** (5–8), parecida com a pergunta e terminando na tônica.'
  - '**Toque tudo** e grave.'
mistakes:
  - 'Resposta muito diferente da pergunta: o estilo clássico gosta de simetria.'
checklist:
  - id: forma
    text: A frase tem pergunta (termina no V) e resposta (termina no I).
  - id: alberti
    text: Usei baixo de Alberti do começo ao fim.
