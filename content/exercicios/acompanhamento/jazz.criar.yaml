id: acompanhamento.jazz.criar
title: Arranjo jazz de uma melodia conhecida
type: performance
stage: creativity
competencies: [acompanhamento.jazz]
prompt: |
  Escolha uma melodia simples (um hino, uma canção folclórica) e transforme em jazz: tétrades
  com extensões, um II–V antes de cada acorde importante, comping em Charleston e um final com
  turnaround I – VI7 – IIm7 – V7.
parameters:
  keys: []
minutes: 45
routine:
  - '**Escolha a melodia** e escreva a harmonia simples em graus.'
  - '**Troque tríades por tétrades** com extensões, checando a melodia.'
  - '**Insira II–V** antes dos acordes de chegada mais importantes.'
  - '**Comping em Charleston** na esquerda, melodia na direita.'
  - '**Final com turnaround** I – VI7 – IIm7 – V7 e grave.'
mistakes:
  - 'Esquecer o swing: colcheias longa-curta o tempo todo.'
checklist:
  - id: harmonia
    text: Reharmonizei com II–V e extensões.
  - id: ritmo
    text: Toquei com colcheias suingadas e comping rítmico.
