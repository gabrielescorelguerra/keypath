id: acompanhamento.post-hardcore.criar
title: Introdução atmosférica para uma música pesada
type: performance
stage: creativity
competencies: [acompanhamento.post-hardcore]
prompt: |
  Crie uma introdução de 8 a 16 compassos para uma música pesada: comece só com pad e um motivo
  de piano ou pluck, acrescente cordas na segunda metade e termine num "drop" (silêncio de um
  tempo antes da banda entrar).
parameters:
  keys: []
minutes: 40
routine:
  - '**Escolha a música e o tom** (frequentemente menor).'
  - '**Pad escuro** com tônica e quinta, segurando.'
  - '**Motivo de 3 a 5 notas** no piano ou pluck, repetido a cada dois compassos.'
  - '**Cordas** a partir da metade.'
  - '**Drop:** um tempo de silêncio antes da banda; grave a introdução inteira.'
mistakes:
  - 'Motivo complicado demais: ele precisa ser lembrado depois de ouvido uma vez.'
checklist:
  - id: crescimento
    text: A introdução cresce em camadas.
  - id: drop
    text: Há um silêncio claro antes da entrada da banda.
