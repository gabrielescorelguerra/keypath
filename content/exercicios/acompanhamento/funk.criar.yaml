id: acompanhamento.funk.criar
title: Um riff funk de clavinet
type: performance
stage: creativity
competencies: [acompanhamento.funk]
prompt: |
  Crie um riff de 1 compasso, de uma nota ou de duas, com semicolcheias, notas fantasma e pelo
  menos uma pausa no tempo forte. Repita sobre um vamp de E9 e varie só o último tempo a cada
  quatro compassos.
parameters:
  keys: []
minutes: 30
routine:
  - '**Vamp de E9** na esquerda (Mi curto no tempo 1) a 90 bpm.'
  - '**Escolha as notas** do riff (uma ou duas, do acorde ou da pentatônica de Mi menor).'
  - '**Ritmo:** fale as semicolcheias e marque onde o riff toca; deixe uma pausa num tempo forte.'
  - '**Notas fantasma** entre as notas principais.'
  - '**Variação do último tempo** a cada quatro compassos; grave 8 compassos.'
mistakes:
  - 'Notas longas: no funk, quase tudo é curto.'
checklist:
  - id: riff
    text: O riff tem semicolcheias, notas fantasma e uma pausa em tempo forte.
  - id: variacao
    text: Variei o último tempo a cada quatro compassos mantendo o groove.
