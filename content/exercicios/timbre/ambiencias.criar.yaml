id: timbre.ambiencias.criar
title: Uma paisagem sonora para um momento de oração
type: performance
stage: creativity
competencies: [timbre.ambiencias]
prompt: |
  Crie 2 a 3 minutos de ambiência para um momento de oração ou leitura: drone, swells, um motivo
  com delay e uma mudança de cor no meio (por exemplo, trocando a nota do drone de tônica para
  subdominante). Grave e escute com fone.
parameters:
  keys: []
minutes: 30
routine:
  - '**Escolha o tom e o timbre** (pad escuro com reverb longo).'
  - '**Grave os 30 primeiros segundos** só com o drone (tônica e quinta).'
  - '**Acrescente swells** na direita: notas longas que crescem do silêncio.'
  - '**Coloque o motivo com delay** no agudo, repetindo a cada dois compassos.'
  - '**Mudança de cor no meio:** troque o drone da tônica para a subdominante e volte.'
  - '**Ouça com fone** do começo ao fim e ajuste o volume das camadas.'
mistakes:
  - 'Tocar demais: ambiência é sobre espaço; uma nota nova a cada 4 a 8 segundos basta.'
checklist:
  - id: duracao
    text: A ambiência tem entre 2 e 3 minutos e se sustenta sem ficar repetitiva.
  - id: mudanca
    text: Há uma mudança de cor perceptível no meio.
