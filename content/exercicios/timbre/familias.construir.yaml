id: timbre.familias.construir
title: Seis famílias a partir do mesmo sintetizador
type: performance
stage: execution
competencies: [timbre.familias]
prompt: |
  No laboratório da aula, carregue cada timbre pronto e **altere uma coisa de cada vez** até
  entender o que define a família. Depois, comece do Órgão e reconstrua cada família sem olhar
  os timbres prontos, anotando os valores.

  | Família | O que define |
  | --- | --- |
  | Pad | ataque e release longos, filtro médio, LFO lento |
  | Pluck | sem sustentação, queda curta |
  | Lead | sustentação alta, ataque curto, onda brilhante |
  | Strings | desafinação alta, ataque médio, vibrato leve |
  | Órgão | envelope "liga-desliga", onda quadrada |
  | Baixo | corte baixo, ressonância, queda curta |
parameters:
  keys: []
minutes: 30
routine:
  - '**Carregue cada timbre pronto** e mude um parâmetro por vez (ataque, release, corte, LFO), tocando
    o mesmo acorde.'
  - '**Anote** o parâmetro que mais muda a "família" do som.'
  - '**Do Órgão ao Pad:** reconstrua o pad sem olhar o pronto; compare.'
  - '**Repita para Pluck, Lead, Strings e Baixo.**'
  - '**Teste final:** toque um timbre seu para alguém e pergunte qual família parece.'
mistakes:
  - Mexer em vários controles ao mesmo tempo — você perde a referência do que causou a mudança.
checklist:
  - id: seis
    text: Reconstruí as seis famílias a partir do Órgão.
  - id: valores
    text: Anotei os valores de cada uma.
  - id: uma-coisa
    text: Para cada família, sei qual é o parâmetro mais importante.
challenges:
  - 'Faça um pad com ataque: ataque curto, mas release longo e reverb alto. Em que estilo ele funcionaria?'
