id: teoria.escolha-de-escalas.notas-guia
title: Notas-guia e escalas no II–V–I
type: performance
stage: application
competencies: [teoria.escolha-de-escalas]
prompt: |
  O playback toca **Dm7 – G7 – C7M – C7M**. Em três etapas:

  1. **Só notas-guia (3ª e 7ª)**, uma por tempo forte: Fá/Dó no Dm7, Si/Fá no G7, Mi/Si no C7M —
     escolhendo sempre a mais próxima da anterior.
  2. **Escala de cada acorde:** Ré dórico, Sol mixolídio, Dó jônio (com ♯4 se quiser lídio) —
     começando cada compasso numa nota-guia.
  3. **Livre**, mas aterrissando em nota-guia no tempo 1 de cada compasso.
parameters:
  keys: [C, F, Bb]
  startBpm: 70
  targetBpm: 110
  bpmStep: 5
  hands: right
  backing: { key: C, degrees: IIm7 V7 I7M I7M, beatsPerChord: 4 }
minutes: 25
routine:
  - '**Toque só os acordes** com a esquerda (Dm7 – G7 – C7M) e cante a 3ª e a 7ª de cada um.'
  - '**Etapa 1, sem playback:** notas-guia em semibreves (uma por compasso), escolhendo sempre a mais próxima:
    Fá → Fá → Mi ou Dó → Si → Si.'
  - '**Etapa 1 com playback**, no andamento inicial, duas voltas.'
  - '**Etapa 2:** escala de cada acorde em colcheias, começando sempre na nota-guia. Diga o nome da escala
    antes de começar a volta.'
  - '**Etapa 3 livre:** quatro voltas; a única regra é aterrissar em nota-guia no tempo 1.'
  - '**Só depois de cumprir as três etapas a 70 bpm**, suba o andamento e passe para Fá e Si♭.'
mistakes:
  - 'Pular de uma nota-guia para outra distante: a graça está no movimento de semitom (Dó → Si, Fá → Mi).'
  - Tocar a escala inteira de baixo para cima a cada compasso — comece no meio, na nota-guia.
checklist:
  - id: guia
    text: Toquei uma volta inteira só com notas-guia, conduzindo por grau conjunto.
  - id: escalas
    text: Troquei de escala a cada acorde no tempo certo.
  - id: tempo-um
    text: Na etapa livre, aterrissei em nota-guia no tempo 1 de cada compasso.
challenges:
  - Troque a escala do G7 pela alterada (Lá♭ menor melódica) e compare.
