id: teoria.pentatonica.cinco-tons
title: Pentatônicas e blues em cinco tons
type: performance
stage: execution
competencies: [teoria.pentatonica-e-blues]
prompt: |
  Em cada tom, toque subindo e descendo duas oitavas, mão direita:

  1. pentatônica **maior**;
  2. pentatônica **menor** da relativa (mesmas notas, começando na 6ª);
  3. escala **blues menor** a partir da tônica menor;
  4. em **grupos de três**: 1-2-3, 2-3-4, 3-4-5… (sequência), a pentatônica maior.

  ::scale{root="C" type="major-pentatonic" octaves="2"}

  ::scale{root="A" type="minor-pentatonic" octaves="2"}

  ::scale{root="A" type="blues" octaves="2"}
parameters:
  keys: [C, G, D, F, Bb]
  startBpm: 60
  targetBpm: 100
  bpmStep: 5
  hands: right
minutes: 25
routine:
  - '**Aquecimento:** pentatônica de Dó maior, uma oitava, 60 bpm, dizendo os graus (1 2 3 5 6).'
  - '**Dedilhado de pentatônica:** use **1 2 3 · 1 2** por oitava, passando o polegar depois do 3º dedo.
    Em tons com pretas, o polegar fica nas brancas.'
  - '**Para cada tom**, os quatro itens seguidos: maior, menor da relativa (3 semitons abaixo), blues menor,
    grupos de três.'
  - '**Grupos de três** primeiro em semínimas a 60 e só depois em colcheias.'
  - '**Dois tons por dia**; no terceiro dia, os cinco seguidos.'
mistakes:
  - 'Achar a relativa contando para o lado errado: a menor relativa fica uma 3ª menor **abaixo** da tônica
    maior.'
  - Na escala blues, tocar a ♭5 como nota de chegada — ela é passagem entre a 4ª e a 5ª.
checklist:
  - id: tons
    text: Toquei os quatro itens nos cinco tons.
  - id: relativa
    text: Encontrei a relativa menor de cada pentatônica sem consultar.
  - id: grupos
    text: Toquei a sequência em grupos de três a pelo menos 80 bpm, em colcheias.
challenges:
  - Toque a pentatônica maior de Fá♯ só nas teclas pretas, de olhos fechados.
  - Faça a escala blues maior (1 2 ♭3 3 5 6) nos mesmos tons.
