id: teoria.pentatonica.licks
title: Criar quatro frases (licks) próprias
type: performance
stage: creativity
competencies: [teoria.pentatonica-e-blues]
prompt: |
  Crie **quatro frases curtas** (1 a 2 compassos) com a pentatônica ou a escala blues:

  - uma subindo, uma descendo;
  - uma com nota repetida e ritmo marcante;
  - uma com a blue note.

  Toque cada uma em três tons diferentes e dê um nome a cada uma — você vai usá-las nos módulos
  de estilo.
parameters:
  keys: []
minutes: 30
routine:
  - '**Improvise 3 minutos** em Lá menor pentatônico, gravando.'
  - '**Ouça a gravação** e pegue os 4 melhores trechos curtos.'
  - '**Ajuste cada frase** para caber em 1 ou 2 compassos e dê um nome.'
  - '**Transponha** cada frase para Mi e Ré, devagar.'
  - '**Anote as quatro** (nomes das notas ou cifra) em Prática → Repertório ou num caderno.'
mistakes:
  - Criar frases que só funcionam num tom porque dependem do desenho das teclas — pense em graus (1, ♭3,
    4…).
checklist:
  - id: quatro
    text: Criei as quatro frases e consigo tocá-las de memória.
  - id: tons
    text: Toquei cada frase em três tons.
challenges:
  - Use duas das frases numa introdução de música do repertório.
