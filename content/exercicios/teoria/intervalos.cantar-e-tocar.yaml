id: teoria.intervalos.cantar-e-tocar
title: Cantar antes de tocar
type: performance
stage: application
competencies: [teoria.intervalos]
prompt: |
  O objetivo é ligar ouvido, voz e mão.

  1. Toque uma nota qualquer e **cante** a nota a um intervalo pedido (comece pela quinta justa
     e pela terça maior).
  2. Só depois toque a nota que você cantou — acertou?
  3. Faça para cima e para baixo. Use notas brancas e pretas.

  Ordem sugerida: 5ª justa → 3ª maior → 3ª menor → 4ª justa → 8ª → 2ª maior → 6ª maior → 7ª menor.
parameters:
  keys: []
minutes: 15
routine:
  - '**Aquecimento (2 min):** toque e cante Dó – Sol – Dó (5ª justa) e Dó – Mi – Dó (3ª maior) até cantar
    afinado.'
  - '**Associe cada intervalo a uma melodia** que você já conhece (o começo de uma música da igreja, por
    exemplo) e anote.'
  - '**Rodada principal:** toque a nota de partida, pense na melodia de referência, cante o intervalo e
    só então confira no teclado. Cinco tentativas por intervalo.'
  - '**Descendente:** repita a rodada cantando para baixo — costuma ser mais difícil; vá devagar.'
  - '**Fechamento:** escolha 5 intervalos ao acaso (sorteie) e tente acertar os cinco seguidos.'
mistakes:
  - Tocar antes de cantar — o exercício só funciona se a voz vem primeiro.
  - 'Cantar alto demais ou forçado: cante em volume de conversa, na região confortável da sua voz.'
checklist:
  - id: cinco
    text: Acertei cinco intervalos seguidos cantando antes de tocar.
  - id: descendente
    text: Fiz também intervalos descendentes (para baixo).
  - id: referencias
    text: Anotei uma música de referência para pelo menos quatro intervalos (o começo de uma melodia que eu conheço).
challenges:
  - Sobre uma nota fixa no grave (um "drone"), cante a escala maior inteira e diga o intervalo de cada nota.
  - Identifique os três primeiros intervalos da melodia de uma música que você toca na igreja.
