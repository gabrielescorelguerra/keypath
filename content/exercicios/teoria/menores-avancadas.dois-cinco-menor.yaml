id: teoria.menores-avancadas.dois-cinco-menor
title: II–V–I menor com o frígio dominante
type: performance
stage: application
competencies: [teoria.menores-avancadas]
prompt: |
  O playback toca o II–V–I menor de Lá: **Bm7(♭5) – E7 – Am7**. Na mão direita:

  1. Sobre o **Bm7(♭5)**, Lá menor natural (é o mesmo que Si lócrio).
  2. Sobre o **E7**, o frígio dominante — Lá menor **harmônica** — destacando o Sol♯ e o Fá.
  3. Sobre o **Am**, de volta à natural, ou a melódica para soar mais "jazz".

  ::scale{root="E" type="phrygian-dominant"}
parameters:
  keys: [A]
  startBpm: 70
  targetBpm: 96
  bpmStep: 6
  hands: right
  backing: { key: A, degrees: IIm7(b5) V7 Im7 Im7, beatsPerChord: 4 }
minutes: 25
routine:
  - '**Toque os acordes** Bm7(♭5) – E7 – Am7 com a esquerda e encontre, em cada um, a nota que muda entre
    a natural e a harmônica: o **Sol♯** no E7.'
  - '**Sem playback, devagar:** uma volta tocando a natural nos compassos 1 e 3 e a harmônica no 2, em semínimas.'
  - '**Com playback no andamento inicial:** duas voltas só com frases que terminam no Sol♯ no E7 e resolvem
    no Lá no Am.'
  - '**Agora livre:** seis voltas sem parar, misturando frases curtas e longas.'
  - '**Suba 6 bpm** a cada série limpa até 96.'
mistakes:
  - Usar o Sol natural sobre o E7 — soa como se a dominante tivesse perdido a força.
  - 'Deixar o Sol♯ pendurado: ele quer subir para o Lá.'
checklist:
  - id: troca
    text: Troquei de escala no E7 e voltei no Am, no tempo certo.
  - id: sensivel
    text: Resolvi o Sol♯ no Lá pelo menos duas vezes.
  - id: voltas
    text: Improvisei seis voltas sem parar.
challenges:
  - Sobre o E7, toque Fá menor melódica (= Mi alterada) e compare a tensão.
