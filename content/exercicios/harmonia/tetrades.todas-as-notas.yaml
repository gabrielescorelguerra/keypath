id: harmonia.tetrades.todas-as-notas
title: As tétrades principais sobre todas as notas
type: performance
competencies: [harmonia.tetrades]
prompt: |
  Sobre cada nota, toque em sequência 7M, 7, m7 e m7(♭5). Exemplo em Dó:

  ::chords{symbols="Cmaj7 C7 Cm7 Cm7b5"}
parameters:
  keys: [C, G, D, A, E, B, F#, Db, Ab, Eb, Bb, F]
  targetBpm: 60
minutes: 20
routine:
  - '**Comece pelo Cmaj7** e mude uma nota de cada vez: 7M → 7 (a sétima desce), 7 → m7 (a terça desce),
    m7 → m7(♭5) (a quinta desce).'
  - '**Diga a nota que muda** antes de tocar cada acorde.'
  - '**4 notas por dia**, seguindo o ciclo de quintas.'
  - '**Ouvido:** de olhos fechados, toque os quatro e tente dizer qual é qual.'
mistakes:
  - Mexer em mais de uma nota por vez — a sequência foi pensada para mudar só uma.
checklist:
  - id: doze-notas
    text: Fiz os quatro tipos sobre as 12 notas.
  - id: fluencia
    text: Troquei de acorde a cada tempo, a 60 bpm, sem parar.
