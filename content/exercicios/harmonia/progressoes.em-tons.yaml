id: harmonia.progressoes.em-tons
title: Cinco progressões em cinco tons
type: performance
stage: execution
competencies: [harmonia.progressoes-comuns]
prompt: |
  Toque cada progressão em cada tom, com condução de vozes na direita e fundamental na esquerda:

  ::progression{key="C" degrees="I V VIm IV"}

  ::progression{key="C" degrees="I VIm IV V"}

  ::progression{key="C" degrees="IIm7 V7 I7M"}

  ::progression{key="C" degrees="I7M IV7M VIIm7(b5) IIIm7 VIm7 IIm7 V7 I7M"}

  ::progression{key="D" degrees="I V VIm IIIm IV I IV V"}
parameters:
  keys: [C, G, D, F, Bb]
  startBpm: 60
  targetBpm: 90
  bpmStep: 5
  hands: both
minutes: 30
routine:
  - '**Uma progressão por vez**, em Dó, até sair sem pensar.'
  - '**Condução de vozes:** na direita, escolha inversões em que as notas comuns ficam paradas e as outras
    andam o mínimo.'
  - '**Os cinco tons, progressão 1:** Dó, Sol, Ré, Fá, Si♭. Depois progressão 2, e assim por diante.'
  - '**Ciclo de quintas (progressão 4):** é a mais longa — divida em duas metades de 4 acordes.'
  - '**Metrônomo a 60**, um acorde por compasso; suba 5 bpm por série limpa.'
mistakes:
  - 'Tocar todos os acordes em posição fundamental: a mão salta e o som fica "quadrado".'
checklist:
  - id: cinco
    text: Toquei as cinco progressões nos cinco tons.
  - id: memoria
    text: A partir do terceiro tom, toquei sem olhar a tela, pensando em graus.
  - id: conducao
    text: A mão direita andou pouco entre os acordes.
challenges:
  - Toque o ciclo de quintas em Mi♭ e Lá♭.
