id: harmonia.campo-maior.12-tons
title: Campo harmônico maior nas 12 tonalidades
type: performance
competencies: [harmonia.campo-harmonico-maior-triades]
prompt: |
  Toque as sete tríades do campo, subindo, dizendo em voz alta o grau de cada uma.
  Em Sol maior:

  ::progression{key="G" degrees="I IIm IIIm IV V VIm VII°"}
parameters:
  keys: [C, G, D, A, E, B, F#, Db, Ab, Eb, Bb, F]
  targetBpm: 60
minutes: 20
routine:
  - '**Fórmula:** maior, menor, menor, maior, maior, menor, diminuto. Diga em voz alta.'
  - '**Monte a escala do tom** primeiro e empilhe terças sobre cada nota (1-3-5 só com notas da escala).'
  - '**Suba o campo** em semínimas a 60 bpm, dizendo o grau ("um, dois menor…").'
  - '**Desça o campo** também — é outro desafio de leitura.'
  - '**4 tons por dia;** no quarto dia, toque os 12 seguidos só com I – IV – V – I.'
mistakes:
  - Tocar o VII como menor (Bm em vez de B°).
  - Mover a mão inteira por blocos sem pensar nas notas — diga o nome do acorde, não só o grau.
checklist:
  - id: tonalidades
    text: Toquei o campo nas 12 tonalidades sem parar mais de dois tempos para pensar.
  - id: graus
    text: Nomeei corretamente o grau de cada acorde.
