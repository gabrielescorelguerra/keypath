id: harmonia.alterados.dois-cinco-um
title: II–V–I com dominante alterado sobre o playback
type: performance
stage: application
competencies: [harmonia.dominantes-alterados]
prompt: |
  O playback toca **Dm7 – G7 – C7M – C7M**. A cada volta, troque o colorido do G7:

  1. G7(13) — sem alteração.
  2. G7(♭9) — Lá♭ no topo.
  3. Upper structure de **Mi♭** sobre o trítono Si–Fá: G7(♯9)(♭13) (Mi♭ = ♭13, Sol = fundamental, Si♭ = ♯9).
  4. Upper structure de **Mi** sobre o trítono: G7(13)(♭9).

  Em todas, a nota de cima do G7 resolve por grau conjunto numa nota do C7M.
parameters:
  keys: [C, F]
  startBpm: 66
  targetBpm: 96
  bpmStep: 6
  hands: both
  backing: { key: C, degrees: IIm7 V7 I7M I7M, beatsPerChord: 4 }
minutes: 30
routine:
  - '**Monte os voicings sem playback.** Esquerda: Ré no Dm7, Sol no G7, Dó no C7M. Direita: Fá-Lá-Dó-Mi
    no Dm7; no G7, comece pelo trítono **Si–Fá** e acrescente a cor da vez.'
  - '**Ensaie as quatro cores do G7 paradas:** G7(13) com Mi em cima; G7(♭9) com Lá♭ em cima; tríade de
    Mi♭ (Mi♭ Sol Si♭) sobre Si–Fá; tríade de Mi (Mi Sol♯ Si) sobre Si–Fá. Toque cada uma 4 vezes resolvendo
    no C7M.'
  - '**Encontre a resolução da nota de cima:** Lá♭ → Sol, Mi♭ → Ré ou Mi, Si♭ → Si (ou Lá), Sol♯ → Lá ou
    Sol. Cante a resolução antes de tocar.'
  - '**Com playback:** uma cor por volta, na ordem 1 → 4, duas rodadas completas.'
  - '**Transponha para Fá** (Gm7 – C7 – F7M): o trítono do C7 é Mi–Si♭; as tríades viram Lá♭ e Lá.'
  - '**Suba 6 bpm** só quando as quatro cores saírem sem hesitar.'
mistakes:
  - 'Tocar a fundamental do G7 na mão direita junto da tríade: deixe o Sol para a esquerda, senão o voicing
    embola.'
  - 'Resolver a tensão saltando: a graça do dominante alterado é a nota de cima descer (ou subir) meio tom.'
checklist:
  - id: quatro
    text: Toquei as quatro versões do G7 sem parar o playback.
  - id: resolucao
    text: A nota de cima de cada versão resolveu por grau conjunto no C7M.
challenges:
  - Use a escala alterada (Lá♭ menor melódica) na direita sobre o G7 e resolva na terça do C7M.
