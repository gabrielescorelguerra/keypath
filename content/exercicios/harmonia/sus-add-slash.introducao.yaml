id: harmonia.sus-add-slash.introducao
title: Criar uma introdução com sus, add9 e baixo
type: performance
stage: creativity
competencies: [harmonia.sus-add-slash]
prompt: |
  Crie uma introdução de 8 compassos para uma música do repertório, usando:

  - pelo menos um acorde **sus** que resolve;
  - pelo menos um **add9**;
  - uma **linha de baixo** com slash chords (descendente, ascendente ou pedal).

  Escreva a cifra e toque três vezes seguidas, sem parar.
parameters:
  keys: []
minutes: 35
routine:
  - '**Escolha a música** e o tom; anote os 2 ou 3 primeiros acordes da estrofe.'
  - '**Desenhe a linha de baixo** (por exemplo I – I/VII – VIm – IV) antes de pensar nos acordes.'
  - '**Coloque as cores:** um sus4 → maior em algum ponto e um add9 no I.'
  - '**Escreva a cifra** dos 8 compassos.'
  - '**Toque 3 vezes seguidas** sem parar e emende na estrofe.'
mistakes:
  - Fazer a introdução num andamento diferente da música — use o metrônomo no andamento da canção.
checklist:
  - id: cifra
    text: Escrevi a cifra da introdução com os três recursos.
  - id: tocar
    text: Toquei a introdução três vezes seguidas, sem parar.
  - id: entrada
    text: A introdução leva naturalmente ao primeiro acorde da música.
challenges:
  - Faça uma versão só com pedal na tônica e outra com baixo descendente; qual combina mais com a letra?
