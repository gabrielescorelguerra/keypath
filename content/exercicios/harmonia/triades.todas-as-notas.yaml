id: harmonia.triades.todas-as-notas
title: Os quatro tipos de tríade sobre todas as notas
type: performance
competencies: [harmonia.triades]
prompt: |
  Sobre cada nota, toque em sequência a tríade maior, menor, diminuta e aumentada.
  Exemplo em Dó:

  ::chords{symbols="C Cm Cdim Caug"}
parameters:
  keys: [C, G, D, A, E, B, F#, Db, Ab, Eb, Bb, F]
  targetBpm: 60
minutes: 15
routine:
  - '**Comece pelo maior** e mude uma nota: maior → menor (a terça desce), menor → diminuta (a quinta desce),
    maior → aumentada (a quinta sobe).'
  - '**Diga o nome das notas** de cada tríade antes de tocar.'
  - '**4 notas por dia** pelo ciclo de quintas; no quarto dia, as 12.'
  - '**Fechamento:** toque só as maiores e menores das 12 notas, sem parar, a 60 bpm.'
mistakes:
  - Tocar a diminuta como menor com a quinta subindo — na diminuta a quinta **desce**.
checklist:
  - id: doze-notas
    text: Fiz os quatro tipos sobre as 12 notas.
  - id: fluencia
    text: Troquei de acorde a cada tempo, a 60 bpm, sem parar.
