id: harmonia.funcoes.substituicoes
title: Variações por substituição de função
type: performance
competencies: [harmonia.funcoes-harmonicas]
prompt: |
  Parta de I – IV – V7 – I e crie variações trocando acordes por outros **de mesma função**
  (IIm no lugar do IV, VIm ou IIIm no lugar do I…). Toque cada variação e compare o som.

  ::progression{key="G" degrees="I IV V7 I"}

  ::progression{key="G" degrees="I IIm7 V7 VIm"}
parameters:
  keys: [C, G, D]
minutes: 20
routine:
  - '**Toque a original** I – IV – V7 – I em Sol duas vezes.'
  - '**Troque o IV pelo IIm7** (Am7): mesma função de subdominante. Toque e compare.'
  - '**Troque o último I pelo VIm** (Em): cadência de engano. Compare.'
  - '**Troque o primeiro I pelo IIIm** e depois pelo VIm: o começo fica menos "estável".'
  - '**Monte 3 variações suas** e toque-as em Dó e Ré.'
mistakes:
  - Substituir o V7 por acorde de outra função — a dominante é o que dá direção à progressão.
checklist:
  - id: tres-variacoes
    text: Criei pelo menos três variações diferentes, em três tons.
  - id: funcao
    text: Para cada acorde trocado, disse em voz alta a função que ele cumpre.
