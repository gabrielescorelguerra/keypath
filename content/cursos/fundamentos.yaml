    upcoming:
      - Intervalos no teclado e de ouvido

  - id: escalas-maior-e-menor
    title: Escala maior e escalas menores
    summary: A fórmula tom–tom–semitom da escala maior e as três escalas menores (natural, harmônica e melódica).
