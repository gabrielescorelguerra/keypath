# Curso: Estilos — a linguagem de cada gênero no teclado.
id: estilos
title: Estilos
summary: Harmonia, ritmo, vocabulário de acordes e acompanhamento de cada gênero, com repertório de referência.
order: 4
modules:
  - id: gospel
    title: Gospel contemporâneo
    summary: Acordes com extensões, acordes de passagem, cadências características e o acompanhamento de igreja.
    level: 3
    style: gospel
    prerequisites: [harmonia-e-tecnica.emprestimo-modal]
    lessons: [acompanhamento.gospel-contemporaneo]
    upcoming:
      - Levadas em 12/8 e em semicolcheias, passo a passo
      - Frases, riffs e corridas (runs)
      - Repertório comentado

  - id: worship
    title: Worship / CCM
    summary: Harmonia simples com cor (sus, add9, baixo pedal), dinâmica em ondas e pads de ambiência.
    level: 2
    style: worship
    prerequisites: [harmonia-e-tecnica.funcoes-e-progressoes]
    upcoming:
      - Características harmônicas
      - Progressões características
      - Vocabulário de acordes
      - Padrões rítmicos
      - Técnicas de acompanhamento
      - Frases, riffs e recursos de improvisação
      - Repertório e artistas de referência

  - id: jazz
    title: Jazz
    summary: II–V–I, voicings sem fundamental, walking bass e a linguagem do bebop.
    level: 4
    style: jazz
    prerequisites: [harmonia-e-tecnica.extensoes]
    upcoming:
      - Características harmônicas
      - Progressões características
      - Vocabulário de acordes
      - Padrões rítmicos
      - Técnicas de acompanhamento
      - Frases, riffs e recursos de improvisação
      - Repertório e artistas de referência

